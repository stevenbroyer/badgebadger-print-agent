name: macos-dmg

# Builds the installable macOS download: one universal .dmg (Apple Silicon +
# Intel) attached to a release. release.yml stopped building the DMG because
# Tauri's bundle_dmg.sh drives Finder over AppleScript and times out on
# headless runners. This job bundles the .app with Tauri and then builds a
# plain drag-to-Applications DMG with hdiutil, which needs no Finder.
#
# With the Apple secrets below, the app and the DMG are signed with the
# Developer ID certificate and notarized, so macOS opens them without the
# "Apple could not verify" warning. Without them (a fork, say) the app is
# ad-hoc signed and macOS only opens it after Privacy & Security → Open
# Anyway.
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_API_KEY               App Store Connect API key ID (Developer access)
#   APPLE_API_ISSUER            that key's issuer ID
#   APPLE_API_KEY_P8            the key's .p8 file contents
#
# It never touches latest.json or the updater bundles, so attaching a DMG to
# an existing release can't push an update to installed agents.
#
# Runs after every successful tag release, or by hand for an existing tag:
#   gh workflow run macos-dmg.yml -f tag=v0.6.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the DMG to (e.g. v0.6.0)"
        required: true
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: write

jobs:
  dmg:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust (stable, both Mac architectures)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Puts the Developer ID identity in a throwaway keychain that both
      # Tauri's codesign and the DMG step use, and writes the notary key to a
      # file. Tauri signs whenever APPLE_SIGNING_IDENTITY is set, so that's
      # exported only once the identity is known to be usable. The notary
      # key goes out as NOTARY_* rather than Tauri's APPLE_API_* names: Tauri
      # would notarize too, but it gives up on the first network error while
      # waiting, and Apple can take hours, so the DMG step notarizes instead.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple signing secrets, so the app will be ad-hoc signed."
            exit 0
          fi
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "APPLE_CERTIFICATE is set but $name is empty"; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          grep -qF "\"$APPLE_SIGNING_IDENTITY\"" <<<"$identities" || { echo "the .p12 doesn't hold a valid APPLE_SIGNING_IDENTITY"; exit 1; }

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "SIGNED=1"
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY"
            echo "NOTARY_ISSUER=$APPLE_API_ISSUER"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
          } >> "$GITHUB_ENV"

      # Universal .app only. Updater artifacts are off so this job needs no
      # signing key and can't produce anything the auto-updater would pick up.
      - name: Tauri build (universal .app)
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package DMG
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/BadgeBadger Print Agent.app"
          [ -d "$app" ] || { echo "missing $app"; ls -la "$(dirname "$app")" || true; exit 1; }

          # Uploads once, then asks Apple for the verdict every minute until
          # there is one. Apple can hold a submission for hours (an account's
          # first ones especially), and a network blip while waiting
          # shouldn't throw that wait away.
          notarize() {
            local file="$1" json="$RUNNER_TEMP/notary.json" id status
            local auth=(--key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
            for attempt in 1 2 3; do
              xcrun notarytool submit "$file" "${auth[@]}" --output-format json > "$json" && break
              [ "$attempt" = 3 ] && { echo "couldn't upload $file for notarization"; return 1; }
              sleep 30
            done
            id="$(plutil -extract id raw -o - "$json")"
            echo "submitted $(basename "$file") for notarization as $id"
            while :; do
              if xcrun notarytool info "$id" "${auth[@]}" --output-format json > "$json" 2>/dev/null; then
                status="$(plutil -extract status raw -o - "$json" 2>/dev/null || echo unknown)"
                case "$status" in
                  Accepted) echo "notarization accepted: $id"; return 0 ;;
                  Invalid|Rejected) cat "$json"; xcrun notarytool log "$id" "${auth[@]}" || true; return 1 ;;
                esac
              fi
              sleep 60
            done
          }
          # A fresh ticket can take a moment to reach Apple's CDN.
          staple() {
            for attempt in 1 2 3 4 5; do
              xcrun stapler staple "$1" && xcrun stapler validate "$1" && return 0
              sleep 30
            done
            return 1
          }

          if [ -n "${SIGNED:-}" ]; then
            # Tauri signed the app with the Developer ID and hardened runtime.
            # Check that, then notarize it and staple the ticket.
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign -dvv "$app" 2>&1)"
            grep -q "^Authority=Developer ID Application" <<<"$details" || { echo "$details"; echo "not signed with a Developer ID"; exit 1; }
            grep -q "flags=.*runtime" <<<"$details" || { echo "$details"; echo "hardened runtime is off"; exit 1; }
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
            notarize "$RUNNER_TEMP/app.zip"
            staple "$app"
            spctl --assess --type execute --verbose=4 "$app" || true
          else
            # Apple Silicon refuses to launch unsigned code, so re-apply an
            # ad-hoc signature across the merged universal bundle.
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$app/Contents/MacOS/$exe")"
          echo "architectures: $archs"
          case "$archs" in *x86_64*) ;; *) echo "no Intel slice"; exit 1 ;; esac
          case "$archs" in *arm64*) ;; *) echo "no Apple Silicon slice"; exit 1 ;; esac

          staging="$(mktemp -d)"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          mkdir -p artifacts
          dmg="artifacts/BadgeBadger.Print.Agent_${version}_universal.dmg"
          # hdiutil occasionally reports "Resource busy" on CI; retry.
          for attempt in 1 2 3; do
            if hdiutil create -volname "BadgeBadger Print Agent" -srcfolder "$staging" -ov -format UDZO "$dmg"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          hdiutil verify "$dmg"

          if [ -n "${SIGNED:-}" ]; then
            # Sign and notarize the DMG as well, so the download itself passes
            # Gatekeeper, and staple its ticket so the check works offline.
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            notarize "$dmg"
            staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" || true
          fi
          ls -la artifacts

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/*.dmg
          retention-days: 14

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" artifacts/*.dmg --repo "${{ github.repository }}" --clobber

      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"
