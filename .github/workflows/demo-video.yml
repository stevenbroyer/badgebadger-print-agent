name: demo-video

# Records the agent's first setup on a clean Windows machine for the docs
# video: install, pairing (when DEMO_SESSION holds a signed-in session
# for the demo org), choosing the card printer, a test print. Runs only from the
# demo-video branch and never touches releases. The recording and its
# caption log come back as an artifact.

on:
  push:
    branches: [demo-video]

jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up the screen, Edge and a card printer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          # A clean Edge: no first-run pages, prompts, sidebar or sign-in nags.
          $edge = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
          New-Item -Path $edge -Force | Out-Null
          $dword = @{
            HideFirstRunExperience = 1; DefaultBrowserSettingEnabled = 0; BrowserSignin = 0
            ShowRecommendationsEnabled = 0; HubsSidebarEnabled = 0; PersonalizationReportingEnabled = 0
            StartupBoostEnabled = 0; EdgeShoppingAssistantEnabled = 0; PromotionalTabsEnabled = 0
            AutoImportAtFirstRun = 4; SyncDisabled = 1; NewTabPageHideDefaultTopSites = 1
            ShowMicrosoftRewards = 0; EdgeCollectionsEnabled = 0; TranslateEnabled = 0
          }
          foreach ($k in $dword.Keys) { New-ItemProperty -Path $edge -Name $k -Value $dword[$k] -PropertyType DWord -Force | Out-Null }
          # Edge allows remote debugging only on a profile of its own, so the
          # recording signs in on one, and web links the agent opens go to it.
          $open = "HKLM:\SOFTWARE\Classes\MSEdgeHTM\shell\open\command"
          $cmd = (Get-ItemProperty $open).'(default)'
          Set-ItemProperty -Path $open -Name "(default)" -Value ($cmd -replace " --single-argument", " --user-data-dir=C:\demo\edge --single-argument")
          # The installer starts the agent through Windows, so an environment
          # variable wouldn't reach it. WebView2's own policy does: it opens
          # the agent's page to the recording script for finding buttons.
          $wv = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $wv -Force | Out-Null
          New-ItemProperty -Path $wv -Name "badgebadger-print-agent.exe" -Value "--remote-debugging-port=9229" -PropertyType String -Force | Out-Null
          # And as a user variable: setting it this way tells Explorer, which
          # is what the installer starts the agent through.
          [Environment]::SetEnvironmentVariable("WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS", "--remote-debugging-port=9229", "User")
          # The agent and the pairing page show this computer's name: a front
          # desk instead of the cloud machine's. Windows reads the DNS host
          # name from here on each call, so no restart is needed.
          $tcp = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters"
          Set-ItemProperty -Path $tcp -Name "Hostname" -Value "FRONT-DESK"
          Set-ItemProperty -Path $tcp -Name "NV Hostname" -Value "FRONT-DESK"
          "host name: " + [System.Net.Dns]::GetHostName()
          # The agent's status check reads the short Windows name from
          # COMPUTERNAME instead, and the page matches the two. A real PC has
          # one name for both; a user variable reaches the agent through
          # Explorer, which the installer starts it through.
          [Environment]::SetEnvironmentVariable("COMPUTERNAME", "FRONT-DESK", "User")
          New-Item -ItemType Directory -Force -Path C:\demo | Out-Null
          # Windows 11 has Cascadia Mono, which the agent shows the computer's
          # name in; this server edition has neither it nor Consolas, and
          # falls back to Courier New.
          "mono fonts before: " + ((Get-ChildItem C:\Windows\Fonts | Where-Object Name -match "^(consola|cascadia)").Name -join ", ")
          gh release download --repo microsoft/cascadia-code --pattern "CascadiaCode-*.zip" --output C:\demo\cascadia.zip
          Expand-Archive C:\demo\cascadia.zip C:\demo\cascadia
          $mono = Get-ChildItem C:\demo\cascadia -Recurse -Filter CascadiaMono.ttf | Select-Object -First 1
          Copy-Item $mono.FullName C:\Windows\Fonts\CascadiaMono.ttf
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts" -Name "Cascadia Mono Regular (TrueType)" -Value "CascadiaMono.ttf" -PropertyType String -Force | Out-Null
          # A card printer that prints into a file, so a test card is real
          # but goes nowhere.
          Add-PrinterPort -Name "C:\demo\test-card.pdf"
          Add-Printer -Name "Zebra ZC300 Card Printer" -DriverName "Microsoft Print To PDF" -PortName "C:\demo\test-card.pdf"
          (Get-CimInstance Win32_Printer -Filter "Name='Microsoft Print to PDF'") | Invoke-CimMethod -MethodName SetDefaultPrinter | Out-Null
          Get-Printer | Select-Object Name, DriverName, PortName | Format-Table -AutoSize
          choco install ffmpeg --no-progress -y | Out-Null
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG=$($ff.FullName)" | Add-Content $env:GITHUB_ENV
          # The latest release's signed installer.
          gh release download --repo stevenbroyer/badgebadger-print-agent --pattern "*_x64-setup.exe" --output C:\demo\setup.exe
          (Get-AuthenticodeSignature C:\demo\setup.exe).SignerCertificate.Subject

      - name: Record the setup
        shell: pwsh
        env:
          DEMO_SESSION: ${{ secrets.DEMO_SESSION }}
          COMPUTERNAME: FRONT-DESK
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File demo\record-setup.ps1 -Setup C:\demo\setup.exe -OutDir (Resolve-Path out)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "test card file: " + (Test-Path C:\demo\test-card.pdf)

      - name: Screenshot the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size); $g.Dispose()
          $bmp.Save("out\desktop-end.png"); $bmp.Dispose()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-recording
          path: out/
