name: demo-video

# Records the agent's setup on a clean Windows machine for the docs video.
# Runs only from the demo-video branch and never touches releases.

on:
  push:
    branches: [demo-video]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Look at the desktop
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          "OS: " + (Get-CimInstance Win32_OperatingSystem).Caption
          "Screen before: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "Set-DisplayResolution ok" } catch { "Set-DisplayResolution failed: $_" }
          Start-Sleep -Seconds 3
          "Screen after: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Session: " + [Environment]::UserInteractive + " user " + $env:USERNAME
          "Edge: " + (Test-Path "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe")
          "WebView2: " + ((Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue).pv)
          "Printer drivers:"; Get-PrinterDriver | Select-Object -ExpandProperty Name
          "Printers:"; Get-Printer | Select-Object -ExpandProperty Name
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size); $g.Dispose()
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          $bmp.Save("probe\desktop.png"); $bmp.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
